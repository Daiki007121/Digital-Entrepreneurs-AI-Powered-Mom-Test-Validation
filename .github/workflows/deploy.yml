name: Deploy

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy-relay:
    name: Deploy Relay Server to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to production (main)
        if: github.ref == 'refs/heads/main'
        run: flyctl deploy --config fly.toml --app digital-entrepreneurs-relay-daiki --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to development (development branch)
        if: github.ref == 'refs/heads/development'
        run: flyctl deploy --config fly.dev.toml --app digital-entrepreneurs-relay-daiki-dev --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Frontend (Next.js) is deployed by Vercel's own GitHub integration —
  # no GitHub Actions step required. Vercel watches push events on the
  # connected repository and deploys main → Production, other branches → Preview.
